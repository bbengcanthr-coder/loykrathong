<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ลอยกระทงออนไลน์</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--night:#070b27;--deep:#111a49;--moon:#f6ecc9;--lantern:#ffb347;--ink:#f3ecd8;--mute:#b4b3d4;--glass:rgba(12,18,58,.86);--line:rgba(246,236,201,.24);--hand:'Noto Sans Thai','Leelawadee UI','Tahoma',sans-serif;--ui:'Noto Sans Thai','Leelawadee UI','Tahoma',sans-serif;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;background:var(--night);color:var(--ink);font-family:var(--ui);line-height:1.6;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lantern);outline-offset:3px}
.sky{position:fixed;inset:0 0 auto 0;height:46%;background:linear-gradient(#04061c,#141d57 72%,#2c3277)}
.stars{position:absolute;left:0;top:0;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 5s ease-in-out infinite alternate}
.stars.b{animation-duration:7s;animation-delay:-3s}
@keyframes tw{from{opacity:.35}to{opacity:1}}
.moon{position:absolute;right:12%;top:12%;width:var(--mw);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffbe8,#f6ecc9 60%,#dccb98);box-shadow:0 0 70px 24px rgba(246,236,201,.22)}
:root{--mw:clamp(54px,12vw,104px)}
.water{position:fixed;inset:44% 0 0 0;background:linear-gradient(#1a2563,#0d1643 45%,#050823);overflow:hidden}
.water::before{content:"";position:absolute;top:0;bottom:0;right:12%;width:var(--mw);background:repeating-linear-gradient(to bottom,rgba(246,236,201,.34) 0 3px,transparent 3px 13px);-webkit-mask-image:linear-gradient(#000,transparent 85%);mask-image:linear-gradient(#000,transparent 85%);animation:sh 6s ease-in-out infinite alternate}
.water::after{content:"";position:absolute;inset:0 -40px;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.05) 0 1px,transparent 1px 20px);animation:dr 14s linear infinite}
@keyframes sh{from{transform:translateX(-6px) scaleX(.9)}to{transform:translateX(6px) scaleX(1.05)}}
@keyframes dr{to{transform:translateX(40px)}}
#river{position:absolute;inset:0}
.kt{position:absolute;left:0;top:var(--top);width:calc(clamp(84px,11vw,150px)*var(--s));cursor:pointer;animation:drift var(--dur) linear infinite;animation-delay:var(--dl);z-index:var(--z)}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(115vw)}}
.kt:hover,.kt.sel,.kt:focus-visible{animation-play-state:paused}
.bob{position:relative;animation:bob 3.4s ease-in-out infinite alternate;animation-delay:var(--bd)}
@keyframes bob{from{transform:translateY(-3px) rotate(-1.6deg)}to{transform:translateY(3px) rotate(1.6deg)}}
.bob img{display:block;width:100%;height:auto;filter:drop-shadow(0 0 10px rgba(255,179,71,.45));-webkit-user-drag:none}
.bob::after{content:"";position:absolute;left:6%;right:6%;bottom:-10%;height:24%;background:radial-gradient(ellipse at center,rgba(255,179,71,.38),transparent 70%);filter:blur(4px)}
.tag{display:block;margin:6px auto 0;max-width:150%;text-align:center;font:500 calc(9px + 3px*var(--s))/1.5 var(--hand);color:var(--moon);opacity:.78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 6px #000}
.kt.mine .bob img{filter:drop-shadow(0 0 18px #ffd27a)}
.kt.mine .tag{opacity:1;color:#ffd27a}
.kt.mine .tag::after{content:" (ของคุณ)"}
.kt.fresh .bob::before{content:"";position:absolute;inset:-16%;border-radius:50%;border:2px solid rgba(255,210,122,.85);animation:ring 1.7s ease-out infinite}
@keyframes ring{from{transform:scale(.7);opacity:1}to{transform:scale(1.25);opacity:0}}
@media (prefers-reduced-motion:reduce){.kt{animation:none;transform:translateX(calc(-30vw + 145vw*var(--ph)))}.bob,.stars,.water::before,.water::after,.kt.fresh .bob::before{animation:none}}
.ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 18px) 20px calc(env(safe-area-inset-bottom,0px) + 22px)}
.ui>*{pointer-events:auto}
.top{max-width:560px}
h1{margin:0;font:600 clamp(30px,6vw,52px)/1.35 var(--hand);color:var(--moon);text-shadow:0 0 28px rgba(246,236,201,.35)}
.sub{margin:6px 0 14px;color:var(--mute);font-size:clamp(14px,2.2vw,17px);line-height:1.75;max-width:36ch}
.count{display:inline-block;padding:7px 14px;border:1px solid var(--line);border-radius:999px;background:rgba(7,11,39,.55);font-size:14px}
.note{margin:10px 0 0;padding:8px 12px;border-left:3px solid var(--lantern);background:rgba(7,11,39,.7);font-size:13px;line-height:1.5;max-width:44ch}
.note:empty{display:none}
.dock{align-self:center;display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
.cta{border:0;border-radius:999px;padding:14px 40px;background:linear-gradient(#ffc766,#ff9a3c);color:#2a1500;font:600 19px var(--ui);cursor:pointer;box-shadow:0 0 30px rgba(255,179,71,.45)}
.cta:hover{filter:brightness(1.07)}
.cta:disabled{opacity:.6;cursor:default}
.ghost{border:1px solid var(--line);border-radius:999px;padding:12px 20px;background:rgba(7,11,39,.6);cursor:pointer;font-size:15px}
.ghost:hover{background:rgba(7,11,39,.85)}
.veil{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 14px);background:rgba(3,5,20,.62)}
.veil.open{display:flex}
.panel{width:100%;max-width:480px;max-height:100%;overflow:auto;padding:22px;border:1px solid var(--line);border-radius:18px;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.panel h2{margin:0 0 14px;font:600 24px/1.4 var(--hand);color:var(--moon)}
.pick{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px}
.pick button{padding:6px 2px;border:2px solid transparent;border-radius:12px;background:rgba(255,255,255,.05);cursor:pointer}
.pick button[aria-checked=true]{border-color:var(--lantern);background:rgba(255,179,71,.14)}
.pick img{display:block;width:100%;height:auto}
label{display:block;margin:0 0 6px;font-size:14px;color:var(--mute)}
input,textarea{width:100%;padding:11px 13px;margin-bottom:12px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.07);font-size:16px;resize:none}
textarea{font-family:var(--ui);line-height:1.7}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 14px}
.chips button{border:1px solid var(--line);border-radius:999px;padding:5px 11px;background:none;font-size:13px;cursor:pointer;color:var(--mute)}
.chips button:hover{color:var(--ink);border-color:var(--ink)}
.err{min-height:20px;margin:0 0 8px;font-size:13px;color:#ffb0a0}
.row{display:flex;gap:10px;justify-content:flex-end}
.fine{margin:14px 0 0;font-size:12px;color:var(--mute);line-height:1.6}
.list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.list li{display:flex;gap:12px;padding:10px;border-radius:12px;background:rgba(255,255,255,.05)}
.list img{width:46px;height:auto;align-self:flex-start}
.list b{font:600 15px/1.5 var(--hand);color:var(--moon)}
.list p{margin:2px 0;font:400 16px/1.7 var(--hand);overflow-wrap:anywhere}
.list small{color:var(--mute);font-size:12px}
.card{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translateX(-50%);z-index:900;display:none;gap:14px;width:min(92vw,420px);padding:16px 18px;border:1px solid var(--line);border-radius:16px;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.card.open{display:flex}
.card img{width:64px;height:auto;align-self:flex-start}
.card b{font:600 17px/1.5 var(--hand);color:var(--moon)}
.card p{margin:4px 0;font:400 17px/1.7 var(--hand);overflow-wrap:anywhere}
.card small{color:var(--mute);font-size:12px}
.x{position:absolute;top:6px;right:8px;width:32px;height:32px;border:0;background:none;font-size:22px;cursor:pointer;color:var(--mute)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 18px);transform:translateX(-50%);z-index:1100;max-width:90vw;padding:11px 18px;border-radius:999px;background:var(--lantern);color:#2a1500;font-weight:500;font-size:15px;opacity:0;pointer-events:none;transition:opacity .3s}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="sky" id="sky"><div class="moon"></div></div>
<div class="water"><div id="river" aria-label="แม่น้ำที่มีกระทงลอยอยู่"></div></div>

<div class="ui">
  <header class="top">
    <h1>ลอยกระทงออนไลน์</h1>
    <p class="sub">เขียนคำอธิษฐาน แล้วปล่อยกระทงไปกับสายน้ำ พร้อมกับทุกคนที่เปิดหน้านี้อยู่ตอนนี้</p>
    <span class="count" id="count" aria-live="polite">กำลังเปิดแม่น้ำ…</span>
    <p class="note" id="note" role="status"></p>
  </header>
  <div class="dock">
    <button class="ghost" id="openWishes" type="button">ดูคำอธิษฐานทั้งหมด</button>
    <button class="cta" id="openMake" type="button">ลอยกระทง</button>
  </div>
</div>

<div class="card" id="card" role="dialog" aria-label="คำอธิษฐาน">
  <button class="x" id="cardX" type="button" aria-label="ปิด">×</button>
  <img id="cardImg" alt="">
  <div><b id="cardName"></b><p id="cardWish"></p><small id="cardTime"></small></div>
</div>

<div class="veil" id="make" role="dialog" aria-modal="true" aria-labelledby="makeT">
  <div class="panel">
    <h2 id="makeT">สร้างกระทงของคุณ</h2>
    <div class="pick" id="pick" role="radiogroup" aria-label="เลือกแบบกระทง"></div>
    <label for="name">ชื่อของคุณ</label>
    <input id="name" maxlength="24" autocomplete="nickname" placeholder="เช่น น้องพลอย">
    <label for="wish">คำอธิษฐาน</label>
    <textarea id="wish" rows="3" maxlength="120" placeholder="ขอให้…"></textarea>
    <div class="chips" id="chips"></div>
    <p class="err" id="err" role="alert"></p>
    <div class="row"><button class="ghost" id="cancel" type="button">ยกเลิก</button><button class="cta" id="go" type="button" style="padding:12px 30px;font-size:17px">ลอยกระทง</button></div>
    <p class="fine">กระทงออนไลน์ไม่มีขยะลงแม่น้ำ ขอขมาพระแม่คงคา แล้วปล่อยสิ่งไม่ดีให้ลอยไปกับสายน้ำ</p>
  </div>
</div>

<div class="veil" id="wishes" role="dialog" aria-modal="true" aria-labelledby="wishT">
  <div class="panel">
    <h2 id="wishT">คำอธิษฐานทั้งหมด</h2>
    <ul class="list" id="list"></ul>
    <div class="row" style="margin-top:14px"><button class="ghost" id="closeWishes" type="button">ปิด</button></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

// sample krathongs keep the river lively until real ones arrive
const demoWishes=['ขอให้ทุกคนมีความสุข','ขอให้สอบผ่านทุกวิชา','ขอให้พ่อแม่สุขภาพแข็งแรง','ขอให้สิ่งไม่ดีลอยไปกับสายน้ำ','ขอให้ได้เจอคนดี ๆ','ขอให้งานราบรื่น','ขอให้มีกินมีใช้ไม่ขัดสน','ขอให้ยิ้มได้ทุกวัน'];
const demoRecs=demoWishes.map((w,i)=>({id:'demo'+i,demo:true,name:'กระทงตัวอย่าง',wish:w,type:TYPES[i%5][0],ts:Date.now()-Math.random()*80000,lane:Math.random(),dur:Math.round(70+Math.random()*50),uid:null}));

function mk(r){
  const s=.55+r.lane*.6,ph=((Date.now()-r.ts)/1000/r.dur+.25)%1;
  const el=document.createElement('div');
  el.className='kt';el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-label','กระทงของ '+r.name+' กดเพื่ออ่านคำอธิษฐาน');
  const st=el.style;st.setProperty('--s',s.toFixed(3));st.setProperty('--top',(3+r.lane*58).toFixed(1)+'%');st.setProperty('--dur',r.dur+'s');st.setProperty('--dl',(-ph*r.dur).toFixed(1)+'s');st.setProperty('--ph',ph.toFixed(3));st.setProperty('--z',Math.round(s*100));
  const bob=document.createElement('div');bob.className='bob';bob.style.setProperty('--bd',(-Math.random()*3).toFixed(1)+'s');
  const im=document.createElement('img');im.src=IMGS[r.type];im.alt='';im.draggable=false;bob.appendChild(im);
  const tag=document.createElement('span');tag.className='tag';tag.textContent=r.name;
  el.append(bob,tag);
  el.addEventListener('click',e=>{e.stopPropagation();showCard(r.id)});
  el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();showCard(r.id)}});
  return el;
}
function sync(){
  const real=allRecs();
  const show=real.slice(0,60);
  for(let i=0;i<Math.max(0,8-real.length);i++)show.push(demoRecs[i]);
  const ids=new Set(show.map(r=>r.id));
  for(const [id,o] of els){if(!ids.has(id)){o.el.remove();els.delete(id)}}
  for(const r of show){
    let o=els.get(r.id);
    if(!o){o={el:mk(r),r};els.set(r.id,o);$('river').appendChild(o.el)}
    o.r=r;o.el.classList.toggle('mine',isMine(r));
  }
  const n=Math.max(real.length,total||0);
  $('count').textContent=n?('มีกระทงลอยอยู่ '+n+' ดวง'):'ยังไม่มีใครลอยกระทง ลอยดวงแรกได้เลย';
  if($('wishes').classList.contains('open'))renderList();
}
function showCard(id){
  const o=els.get(id);if(!o)return;closeCard();
  const r=o.r;cardId=id;o.el.classList.add('sel');
  $('cardImg').src=IMGS[r.type];$('cardName').textContent=r.name;$('cardWish').textContent=r.wish;
  $('cardTime').textContent=r.demo?'กระทงตัวอย่างจนกว่าจะมีคนมาลอยเพิ่ม':'ลอยเมื่อ '+ago(r.ts);
  $('card').classList.add('open');
}
function closeCard(){const o=els.get(cardId);if(o)o.el.classList.remove('sel');cardId=null;$('card').classList.remove('open')}
$('cardX').onclick=closeCard;
document.querySelector('.water').addEventListener('click',closeCard);

function renderList(){
  const ul=$('list');ul.textContent='';
  const real=allRecs();
  if(!real.length){const li=document.createElement('li');li.textContent='ยังไม่มีคำอธิษฐาน เป็นคนแรกที่ลอยกระทงได้เลย';ul.appendChild(li);return}
  for(const r of real){
    const li=document.createElement('li'),im=document.createElement('img'),d=document.createElement('div');
    im.src=IMGS[r.type];im.alt='';
    const b=document.createElement('b'),p=document.createElement('p'),s=document.createElement('small');
    b.textContent=r.name;p.textContent=r.wish;s.textContent=ago(r.ts);
    d.append(b,p,s);li.append(im,d);ul.appendChild(li);
  }
}

// dialogs
let lastFocus=null;
function openV(id,focus){lastFocus=document.activeElement;$(id).classList.add('open');if(focus)setTimeout(()=>$(focus).focus(),30)}
function closeV(id){$(id).classList.remove('open');if(lastFocus&&lastFocus.focus)lastFocus.focus()}
$('openMake').onclick=()=>{$('err').textContent='';closeCard();openV('make','name')};
$('cancel').onclick=()=>closeV('make');
$('openWishes').onclick=()=>{closeCard();renderList();openV('wishes','closeWishes')};
$('closeWishes').onclick=()=>closeV('wishes');
for(const id of ['make','wishes'])$(id).addEventListener('mousedown',e=>{if(e.target.id===id)closeV(id)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){for(const id of ['make','wishes'])if($(id).classList.contains('open'))closeV(id);closeCard()}});

// picker + wish suggestions
TYPES.forEach(([k,label],i)=>{
  const b=document.createElement('button');b.type='button';b.setAttribute('role','radio');b.setAttribute('aria-label',label);b.setAttribute('aria-checked',i===0);
  const im=document.createElement('img');im.src=IMGS[k];im.alt='';b.appendChild(im);
  b.onclick=()=>{sel=k;[...$('pick').children].forEach(c=>c.setAttribute('aria-checked',c===b))};
  $('pick').appendChild(b);
});
SUGG.forEach(t=>{const b=document.createElement('button');b.type='button';b.textContent=t;b.onclick=()=>{$('wish').value=t;$('wish').focus()};$('chips').appendChild(b)});

// float a krathong
function addLocal(rec,id){local.push({...rec,id});sync();return id}
$('go').onclick=async()=>{
  const name=$('name').value.trim().slice(0,24)||'ไม่ประสงค์ออกนาม',wish=$('wish').value.trim().slice(0,120);
  if(!wish){$('err').textContent='เขียนคำอธิษฐานก่อน แล้วค่อยกดลอยกระทง';$('wish').focus();return}
  if(Date.now()-lastFloat<15000){$('err').textContent='ลอยได้ทุก 15 วินาที รออีกสักครู่แล้วกดใหม่';return}
  lastFloat=Date.now();
  const rec={name,wish,type:sel,ts:Date.now(),lane:Math.random(),dur:Math.round(70+Math.random()*50),uid:myId||null};
  $('go').disabled=true;
  const id=crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16)});
  mineIds.add(id);saveMine();addLocal(rec,id);
  const pending=sb?sb.from('krathongs').insert({id,name,wish,type:sel,lane:rec.lane,dur:rec.dur}):null;
  $('go').disabled=false;$('wish').value='';
  closeV('make');
  const o=els.get(id);if(o){o.el.classList.add('fresh');setTimeout(()=>o.el.classList.remove('fresh'),9000)}
  toast('กระทงของคุณลอยออกไปแล้ว ขอให้สมหวัง');
  if(!pending){note('ยังไม่ได้เชื่อมต่อ Supabase กระทงนี้เห็นเฉพาะในเครื่องคุณ');return}
  let err=null;try{err=(await pending).error}catch(e){err=e}
  if(err)note('ส่งกระทงเข้าแม่น้ำร่วมกันไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วลองลอยใหม่ กระทงนี้จะเห็นเฉพาะในเครื่องคุณ');
  else loadTotal();
};

// ===== Supabase =====
const SUPABASE_URL='https://svpocfjextzclbptgjrj.supabase.co';       // เช่น https://abcdxyz.supabase.co
const SUPABASE_KEY='sb_publishable_FQQqNE0kFG6mf5UW4IaX6Q_ngmYNCvD';   // sb_publishable_... (หรือ anon key แบบเดิม)
const COLS='id,created_at,name,wish,type,lane,dur';
const allRecs=()=>{const m=new Map();for(const r of [...local,...remote])m.set(r.id,r);return [...m.values()].sort((a,b)=>b.ts-a.ts)};
const fromRow=d=>norm(d.id,{...d,ts:Date.parse(d.created_at)});
async function loadTotal(){try{const c=await sb.from('krathongs').select('id',{count:'exact',head:true});if(!c.error&&c.count!=null){total=c.count;sync()}}catch(e){}}
async function loadAll(){
  try{
    const {data,error}=await sb.from('krathongs').select(COLS).order('created_at',{ascending:false}).limit(150);
    if(error)throw error;
    remote=data.map(fromRow);
    if($('note').textContent.startsWith('อ่านกระทง'))note('');
    sync();
  }catch(e){note('อ่านกระทงของคนอื่นไม่ได้ ตรวจสอบอินเทอร์เน็ตหรือการตั้งค่า Supabase แล้วเปิดหน้านี้ใหม่')}
}
(async function init(){
  sync();
  if(!window.supabase){note('โหลดไลบรารี Supabase ไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วเปิดหน้านี้ใหม่ ตอนนี้ลอยได้เฉพาะในเครื่องนี้');return}
  if(SUPABASE_URL.startsWith('PASTE')||SUPABASE_KEY.startsWith('PASTE')){note('ยังไม่ได้ตั้งค่า Supabase ใส่ Project URL และ Publishable key ที่ต้นสคริปต์ (SUPABASE_URL / SUPABASE_KEY) ตอนนี้ลอยได้เฉพาะในเครื่องนี้');return}
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  await loadAll();loadTotal();
  sb.channel('river').on('postgres_changes',{event:'INSERT',schema:'public',table:'krathongs'},p=>{
    if(!p.new||remote.some(r=>r.id===p.new.id))return;
    remote=[fromRow(p.new),...remote].sort((a,b)=>b.ts-a.ts).slice(0,150);
    if(total!==null)total++;
    sync();
  }).subscribe();
  setInterval(()=>{loadAll();loadTotal()},30000);
})();
</script>
